name: Build Android (test APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@^7.0.0 @capacitor/filesystem@^7.0.0 send-intent@^7.0.0

      - name: Create Android project
        run: |
          npx cap add android
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          act = '''
                  <activity
                      android:name="de.mindlib.sendIntent.SendIntentActivity"
                      android:label="@string/app_name"
                      android:exported="true"
                      android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
          '''
          if 'SendIntentActivity' not in s:
              assert s.count('</application>') == 1
              s = s.replace('</application>', act + '    </application>')
          open(p, 'w').write(s)
          print(s)
          PY
          npx cap sync android
          printf "\next.androidxBrowserVersion = '1.8.0'\n" >> android/variables.gradle
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.browser:browser:1.8.0'
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: YourMoney-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YourMoney.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android 最新测试版" --notes "每次打包后自动更新。直接下载 YourMoney.apk。" --prerelease
          gh release upload android-latest YourMoney.apk --clobber
