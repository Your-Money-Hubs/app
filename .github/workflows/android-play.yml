name: Build Android (Play AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@^7.0.0 @capacitor/filesystem@^7.0.0 @capacitor/haptics@^7.0.0 send-intent@^7.0.0

      - name: Create Android project
        run: |
          npx cap add android
          cp -r native/icon/android/. android/app/src/main/res/
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FAFAF8</color>
          </resources>
          XML
          sed -i 's/^          //' android/app/src/main/res/values/ic_launcher_background.xml
          for f in $(find android/app/src/main/res -iname 'splash*.png'); do cp native/splash/splash-light.png "$f"; done
          mkdir -p android/app/src/main/res/drawable-night
          cp native/splash/splash-dark.png android/app/src/main/res/drawable-night/splash.png
          find android/app/src/main/res -iname 'splash*' | head -20
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          act = '''
                  <activity
                      android:name="de.mindlib.sendIntent.SendIntentActivity"
                      android:label="@string/app_name"
                      android:exported="true"
                      android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
          '''
          if 'SendIntentActivity' not in s:
              assert s.count('</application>') == 1
              s = s.replace('</application>', act + '    </application>')
          svc = '''
                  <service
                      android:name=".PayNotifService"
                      android:label="YourMoney"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
          '''
          deeplink = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="yourmoney" />
                      </intent-filter>
          '''
          if 'android:scheme="yourmoney"' not in s:
              i = s.index('android:name=".MainActivity"')
              j = s.index('</activity>', i)
              s = s[:j] + deeplink + '        ' + s[j:]
          if 'PayNotifService' not in s:
              s = s.replace('</application>', svc + '    </application>')
          open(p, 'w').write(s)
          print(s)
          PY
          JAVA_DIR=android/app/src/main/java/com/yourmoneyhubs/app
          cp native/android/PayNotifService.java native/android/PayNotifPlugin.java $JAVA_DIR/
          cat > $JAVA_DIR/MainActivity.java <<'JAVA'
          package com.yourmoneyhubs.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PayNotifPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's/^          //' $JAVA_DIR/MainActivity.java
          cat $JAVA_DIR/MainActivity.java
          npx cap sync android
          printf "\next.androidxBrowserVersion = '1.8.0'\n" >> android/variables.gradle
          sed -i -E 's/(compileSdkVersion|targetSdkVersion) *= *[0-9]+/\1 = 36/' android/variables.gradle
          echo 'android.suppressUnsupportedCompileSdk=36' >> android/gradle.properties
          grep -n 'SdkVersion' android/variables.gradle
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.browser:browser:1.8.0'
                  }
              }
          }
          GRADLE

      - name: Sign and build release AAB
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          test -n "$KS_B64" || { echo "缺少 ANDROID_KEYSTORE_BASE64 密钥，请先在仓库 Settings > Secrets 添加"; exit 1; }
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \n\r\t"')
          echo "密钥文字长度: ${#CLEAN}（应为 3560 左右）"
          printf '%s' "$CLEAN" | base64 -d > android/upload.keystore || { echo "ANDROID_KEYSTORE_BASE64 内容不完整或复制错了，请重新完整复制 keystore_base64.txt 里的全部文字"; exit 1; }
          cd android
          python3 - <<'PY'
          import os,re
          p='app/build.gradle'
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+','versionCode '+os.environ['RUN_NO'],s)
          s=re.sub(r'versionName\s+"[^"]*"','versionName "1.0.'+os.environ['RUN_NO']+'"',s)
          sign="""
              signingConfigs {
                  release {
                      storeFile file('../upload.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
          """
          s=s.replace('buildTypes {',sign+'    buildTypes {',1)
          s=s.replace('release {\n            minifyEnabled','release {\n            signingConfig signingConfigs.release\n            minifyEnabled',1)
          open(p,'w').write(s)
          print(s)
          PY
          chmod +x gradlew
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: YourMoney-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
